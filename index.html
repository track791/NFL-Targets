<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #f0f4f8; font-family: "Barlow", sans-serif; display: flex; justify-content: center; padding: 20px; }
  #card { width: 1000px; border-radius: 12px; overflow: hidden; box-shadow: 0 8px 40px rgba(0,0,0,0.18); }

  #header { background: linear-gradient(135deg, #00c8e0 0%, #00a8c0 40%, #008fa8 100%); display: grid; grid-template-columns: 1fr 160px 1fr; align-items: center; min-height: 140px; }
  #header-left { padding: 20px 24px; }
  #header-left h1 { font-family: "Oswald", sans-serif; font-size: 26px; font-weight: 700; color: #0a2a30; line-height: 1.15; text-transform: uppercase; letter-spacing: 1px; }
  #header-left h1 span { color: #fff; }
  #header-left .subnote { margin-top: 8px; font-size: 10.5px; font-weight: 500; color: #0a2a30; line-height: 1.5; }
  #header-logo { display: flex; justify-content: center; align-items: center; }
  #header-logo-placeholder { width: 120px; height: 120px; border-radius: 50%; border: 3px solid rgba(255,255,255,0.4); overflow: hidden; background: #0d1b2a; }
  #header-logo-placeholder img { width: 100%; height: 100%; object-fit: cover; }
  #header-right { padding: 20px 24px; text-align: right; }
  #follow-row { display: flex; align-items: center; justify-content: flex-end; gap: 8px; margin-bottom: 6px; }
  #follow-label { font-family: "Oswald", sans-serif; font-size: 18px; font-weight: 600; color: #0a2a30; letter-spacing: 2px; }
  #brand-name { font-family: "Oswald", sans-serif; font-size: 20px; font-weight: 700; color: #fff; letter-spacing: 1px; display: block; margin-bottom: 2px; }
  #platform-text { font-size: 12px; color: rgba(10,42,48,0.85); font-weight: 500; letter-spacing: 1px; display: block; }
  #date-badge { margin-top: 10px; display: inline-block; background: rgba(255,255,255,0.25); border-radius: 6px; padding: 4px 12px; font-family: "Oswald", sans-serif; font-size: 13px; font-weight: 600; color: #0a2a30; letter-spacing: 1px; }

  #table-wrap { background: #ffffff; }
  table { width: 100%; border-collapse: collapse; font-size: 11px; table-layout: fixed; }

  .group-header-row th { background: #c8e6f5; color: #0d3349; font-family: "Oswald", sans-serif; font-size: 10px; font-weight: 700; text-align: center; padding: 5px 4px; letter-spacing: 0.4px; border-bottom: 1px solid #a0cce0; }
  .group-header-row th.empty { background: #ffffff; }
  .group-header-row th.def-header { background: #ffe8c8; color: #7d3c00; }

  .col-headers th { background: #0d3349; color: #ffffff; font-family: "Oswald", sans-serif; font-size: 10px; font-weight: 600; text-align: center; padding: 7px 3px; letter-spacing: 0.3px; border-bottom: 2px solid #00c8e0; }
  .col-headers th.left { text-align: left; padding-left: 8px; }

  tbody tr.pair-a { background: #ffffff; }
  tbody tr.pair-b { background: #eaf6fd; }
   td { padding: 6px 3px; text-align: center; color: #1a1a2e; border-bottom: 1px solid #e4eef5; font-size: 12px; }
  td.tm-cell   { font-weight: 700; color: #0d3349; text-align: left; padding-left: 10px; font-family: "Oswald", sans-serif; font-size: 12px; letter-spacing: 0.3px; }
  td.name-cell { font-size: 13px; font-weight: 600; color: #0d1b2a; }
  td.opp-cell  { font-size: 11.5px; font-weight: 600; color: #5a6b7a; }
  td.cs        { font-weight: 700; font-size: 14px; font-variant-numeric: tabular-nums; }

  #loading, #error-msg { padding: 40px; text-align: center; color: #64748b; font-size: 14px; }
  #error-msg { display: none; color: #b91c1c; }

  #footer { background: #0d3349; color: rgba(255,255,255,0.75); font-family: "Oswald", sans-serif; font-size: 10px; letter-spacing: 1px; text-align: center; padding: 9px; }
</style>

    <div id="loading">Loading this week's targets...</div>
    <div id="error-msg">Failed to load data. Please try refreshing.</div>
    <table id="data-table" style="display:none;">
      <thead>
        <tr class="group-header-row" id="group-row"></tr>
        <tr class="col-headers" id="header-row"></tr>
      </thead>
      <tbody id="table-body"></tbody>
    </table>
  </div>
  <div id="footer" id="footer-text">TRACKINVESTING &nbsp;|&nbsp; BETA NFL TARGETS &nbsp;|&nbsp; FOR ENTERTAINMENT PURPOSES</div>
</div>

<script>
  // ── Paste your deployed Apps Script /exec URL here ──────────────────────
  var DATA_URL = "https://script.google.com/macros/s/AKfycbzlqtxwzmeVkDWIT6R_DfUN4bjLiuduKZrmohAdooGjuZM4lQoY_wO4NL7CB686PVznAg/exec";

  function qs(name) {
    var m = new RegExp("[?&]" + name + "=([^&]*)").exec(window.location.search);
    return m ? decodeURIComponent(m[1]) : "";
  }
  var POS = (qs("pos") || "qb").toUpperCase();

  // Higher allowed = better matchup = green. Same direction as the MLB HR sheet.
  function getColor(val, min, max) {
    if (isNaN(val)) return "";
    var t = (max === min) ? 0.5 : (val - min) / (max - min);
    var r, g, b, s;
    if (t < 0.5) { s = t * 2;         r = Math.round(230 + (255-230)*s); g = Math.round(124 + (255-124)*s); b = Math.round(115 + (255-115)*s); }
    else         { s = (t - 0.5) * 2; r = Math.round(255 + ( 87-255)*s); g = Math.round(255 + (187-255)*s); b = Math.round(255 + (138-255)*s); }
    return "rgb(" + r + "," + g + "," + b + ")";
  }

  function fmtNum(v, isPct) {
    var n = parseFloat(String(v).replace("%", ""));
    if (isNaN(n)) return "N/A";
    if (isPct) return (n <= 1 ? n * 100 : n).toFixed(0) + "%";
    return (Math.round(n) === n) ? String(n) : n.toFixed(2);
  }

  function render(d) {
    if (d.error) { throw new Error(d.error); }
    
    document.getElementById("card").style.width = (d.cardWidth || 1000) + "px";
    document.getElementById("title-pos").textContent = (d.title || "NFL TARGETS").replace("NFL ", "NFL ");
    document.getElementById("subnote").innerHTML =
      "&bull; OPPONENT DEFENSE ALLOWED, PER GAME<br>&bull; " +
      (d.season || "") + " SEASON" + (d.week ? " &bull; WEEK " + d.week : "");

    var today = new Date();
    document.getElementById("date-badge").textContent =
      (today.getMonth() + 1) + "/" + today.getDate() + "/" + today.getFullYear();

    var headers = d.headers || [];
    var rows    = d.rows || [];
    var numeric = d.numeric || [];
    var firstStat = numeric.length ? numeric[0] : headers.length;

    // Group header band: identity columns, then the defense-allowed block.
    var groupRow = document.getElementById("group-row");
    groupRow.innerHTML = "";
    var thA = document.createElement("th");
    thA.className = "empty"; thA.colSpan = firstStat;
    groupRow.appendChild(thA);
    if (numeric.length) {
      var thB = document.createElement("th");
      thB.className = "def-header"; thB.colSpan = numeric.length;
      thB.textContent = "Opponent Defense Allowed / Game";
      groupRow.appendChild(thB);
    }

    var headRow = document.getElementById("header-row");
    headRow.innerHTML = "";
    headers.forEach(function (h, i) {
      var th = document.createElement("th");
      th.textContent = h;
      if (i < firstStat - 1) th.className = "left";
      headRow.appendChild(th);
    });

    // Column min/max for the heat map.
    var colMin = {}, colMax = {};
    numeric.forEach(function (ci) {
      var vals = rows.map(function (r) { return parseFloat(String(r[ci]).replace("%", "")); })
                     .filter(function (v) { return !isNaN(v); });
      colMin[ci] = vals.length ? Math.min.apply(null, vals) : 0;
      colMax[ci] = vals.length ? Math.max.apply(null, vals) : 1;
    });

    var tbody = document.getElementById("table-body");
    tbody.innerHTML = "";
    var pairIdx = {}, pairCount = 0;
    rows.forEach(function (row) {
      var tr = document.createElement("tr");
      var pk = [String(row[0]), String(row[firstStat - 1])].sort().join("|");
      if (!(pk in pairIdx)) pairIdx[pk] = pairCount++;
      tr.className = (pairIdx[pk] % 2 === 0) ? "pair-a" : "pair-b";
      row.forEach(function (val, ci) {
        var td = document.createElement("td");
        if (numeric.indexOf(ci) !== -1) {
          td.textContent = fmtNum(val, /%/.test(headers[ci] || ""));
          td.className = "cs";
          var n = parseFloat(String(val).replace("%", ""));
           if (!isNaN(n) && (d.plain || []).indexOf(ci) === -1) {
            var lo = colMin[ci], hi = colMax[ci];
            var inv = (d.invert || []).indexOf(ci) !== -1;
            td.style.background = getColor(inv ? (lo + hi - n) : n, lo, hi);
          }
        } else if (ci === 0) {
          td.textContent = val; td.className = "tm-cell";
        } else if (ci === firstStat - 1) {
          td.textContent = val; td.className = "opp-cell";
        } else {
          td.textContent = val; td.className = "name-cell";
        }
        tr.appendChild(td);
      });
      tbody.appendChild(tr);
    });

    document.getElementById("loading").style.display = "none";
    document.getElementById("data-table").style.display = "table";
  }

  function fetchData() {
    var cb = "nflTargets_" + Date.now();
    var s  = document.createElement("script");
    var timer;
    function fail() {
      document.getElementById("loading").style.display = "none";
      document.getElementById("error-msg").style.display = "block";
    }
    window[cb] = function (d) {
      clearTimeout(timer);
      delete window[cb];
      if (document.body.contains(s)) document.body.removeChild(s);
      try { render(d); } catch (e) { fail(); }
    };
    s.onerror = function () { clearTimeout(timer); fail(); };
    timer = setTimeout(function () { if (window[cb]) { delete window[cb]; fail(); } }, 30000);
    s.src = DATA_URL + "?pos=" + POS.toLowerCase() + "&callback=" + cb;
    document.body.appendChild(s);
  }
  fetchData();
</script>
</body>
</html>
